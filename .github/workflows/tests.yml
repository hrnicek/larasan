name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: pm
          POSTGRES_USER: pm
          POSTGRES_PASSWORD: pm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # DB_DATABASE is deliberately absent. PHPUnit's <env> entries only apply when the
    # variable is not already set, so a job-level DB_DATABASE would silently override
    # phpunit.xml and run the suite against the development database.
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: pm
      DB_PASSWORD: pm
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_PASSWORD: "null"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, redis
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # phpunit.xml pins the suite to pm_testing; the service container creates pm only.
      - name: Create the test database
        run: PGPASSWORD=pm psql -h 127.0.0.1 -U pm -d pm -c 'CREATE DATABASE pm_testing'

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check
