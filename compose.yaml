# Container hostnames belong in .env.docker.example, not here:
# php artisan serve only forwards a fixed list of env vars to the request.

x-app: &app
    build:
        context: ./vendor/laravel/sail/runtimes/8.4
        dockerfile: Dockerfile
        args:
            WWWGROUP: '${WWWGROUP:-1000}'
    image: sail-8.4/app
    extra_hosts:
        - 'host.docker.internal:host-gateway'
    volumes:
        - '.:/var/www/html'
        # Keeps the container's platform-specific node_modules binaries apart from the host's.
        - 'sail-node-modules:/var/www/html/node_modules'
        # Named to load after the image's 99-sail.ini.
        - './docker/php/99-zz-larasan.ini:/etc/php/8.4/cli/conf.d/99-zz-larasan.ini:ro'
    networks:
        - sail
    environment:
        WWWUSER: '${WWWUSER:-1000}'
        LARAVEL_SAIL: 1
        XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
        XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
    depends_on:
        pgsql:
            condition: service_healthy
        redis:
            condition: service_healthy
        meilisearch:
            condition: service_healthy

services:
    laravel.test:
        <<: *app
        ports:
            - '${APP_PORT:-8000}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'

    horizon:
        <<: *app
        command: ['php', 'artisan', 'horizon']
        depends_on:
            laravel.test:
                condition: service_started
            pgsql:
                condition: service_healthy
            redis:
                condition: service_healthy

    reverb:
        <<: *app
        command: ['php', 'artisan', 'reverb:start']
        ports:
            # Not REVERB_PORT, which is the in-network port PHP dials; browsers use VITE_REVERB_PORT.
            - '${FORWARD_REVERB_PORT:-8080}:8080'
        depends_on:
            laravel.test:
                condition: service_started
            redis:
                condition: service_healthy

    pgsql:
        image: 'postgres:17-alpine'
        ports:
            - '127.0.0.1:${FORWARD_DB_PORT:-5432}:5432'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-secret}'
            POSTGRES_DB: '${DB_DATABASE:-pm}'
            POSTGRES_USER: '${DB_USERNAME:-pm}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql/data'
            - './docker/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
        networks:
            - sail
        healthcheck:
            test: ['CMD', 'pg_isready', '-q', '-d', '${DB_DATABASE:-pm}', '-U', '${DB_USERNAME:-pm}']
            interval: 5s
            retries: 10
            timeout: 5s

    redis:
        image: 'redis:7-alpine'
        ports:
            - '127.0.0.1:${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            retries: 10
            timeout: 5s

    meilisearch:
        image: 'getmeili/meilisearch:v1.17'
        ports:
            - '127.0.0.1:${FORWARD_MEILISEARCH_PORT:-7700}:7700'
        environment:
            MEILI_NO_ANALYTICS: '${MEILISEARCH_NO_ANALYTICS:-true}'
        volumes:
            - 'sail-meilisearch:/meili_data'
        networks:
            - sail
        healthcheck:
            test: ['CMD', 'wget', '--no-verbose', '--spider', 'http://127.0.0.1:7700/health']
            interval: 5s
            retries: 10
            timeout: 5s

    mailpit:
        image: 'axllent/mailpit:v1.31'
        ports:
            - '127.0.0.1:${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '127.0.0.1:${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - sail

networks:
    sail:
        driver: bridge

volumes:
    sail-pgsql:
        driver: local
    sail-redis:
        driver: local
    sail-meilisearch:
        driver: local
    sail-node-modules:
        driver: local
