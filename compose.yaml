# Docker for local development, through Laravel Sail. The application also runs directly on a host
# with PHP, Node, PostgreSQL, Redis and Meilisearch installed — see CONTRIBUTING.md — and neither
# way is the "real" one.
#
# The hostnames a container resolves live in `.env.docker.example`, which is copied over `.env`.
# They are deliberately not set here: `php artisan serve` passes only a fixed list of variables
# through to a request (ServeCommand::$passthroughVariables), so anything set in this file would
# reach an artisan command and never the served application.

x-app: &app
    build:
        context: ./vendor/laravel/sail/runtimes/8.4
        dockerfile: Dockerfile
        args:
            WWWGROUP: '${WWWGROUP:-1000}'
    image: sail-8.4/app
    extra_hosts:
        - 'host.docker.internal:host-gateway'
    volumes:
        - '.:/var/www/html'
        # A volume of its own, so the container's `node_modules` and a host one never overwrite
        # each other. esbuild and rollup ship platform-specific binaries, and a checkout used both
        # ways would otherwise install Linux ones over the host's on every `npm install`.
        - 'sail-node-modules:/var/www/html/node_modules'
        # Sorted after the image's own 99-sail.ini. See the file for what it settles.
        - './docker/php/99-zz-larasan.ini:/etc/php/8.4/cli/conf.d/99-zz-larasan.ini:ro'
    networks:
        - sail
    environment:
        WWWUSER: '${WWWUSER:-1000}'
        LARAVEL_SAIL: 1
        XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
        XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
    depends_on:
        pgsql:
            condition: service_healthy
        redis:
            condition: service_healthy
        meilisearch:
            condition: service_healthy

services:
    laravel.test:
        <<: *app
        ports:
            # 8000 rather than 80, because `.env.example` already says APP_URL=http://localhost:8000
            # and a URL the application prints should be one that works.
            - '${APP_PORT:-8000}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'

    # The queue, supervised as it is in production (ADR-0011). Without it an invitation is written
    # and never sent, a thumbnail is never made, and the inbox stays empty.
    horizon:
        <<: *app
        command: ['php', 'artisan', 'horizon']
        depends_on:
            laravel.test:
                condition: service_started
            pgsql:
                condition: service_healthy
            redis:
                condition: service_healthy

    # Realtime is an enhancement, never the source of truth (ADR-0008) — the application works
    # with this container stopped, and only presence degrades.
    reverb:
        <<: *app
        command: ['php', 'artisan', 'reverb:start']
        ports:
            # Forwarded like every other service, and deliberately not tied to REVERB_PORT: that
            # one is what PHP dials inside the network, where the server always listens on 8080.
            # A browser reaching a different port is what VITE_REVERB_PORT is for.
            - '${FORWARD_REVERB_PORT:-8080}:8080'
        depends_on:
            laravel.test:
                condition: service_started
            redis:
                condition: service_healthy

    pgsql:
        image: 'postgres:17-alpine'
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-secret}'
            POSTGRES_DB: '${DB_DATABASE:-pm}'
            POSTGRES_USER: '${DB_USERNAME:-pm}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
            POSTGRES_HOST_AUTH_METHOD: trust
        volumes:
            - 'sail-pgsql:/var/lib/postgresql/data'
            - './docker/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
        networks:
            - sail
        healthcheck:
            test: ['CMD', 'pg_isready', '-q', '-d', '${DB_DATABASE:-pm}', '-U', '${DB_USERNAME:-pm}']
            interval: 5s
            retries: 10
            timeout: 5s

    redis:
        image: 'redis:7-alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            retries: 10
            timeout: 5s

    # Search only (ADR-0016). PostgreSQL still decides what may be seen, so the application serves
    # without this container — set SCOUT_DRIVER=database or null to skip it entirely.
    meilisearch:
        image: 'getmeili/meilisearch:v1.17'
        ports:
            - '${FORWARD_MEILISEARCH_PORT:-7700}:7700'
        environment:
            MEILI_NO_ANALYTICS: '${MEILISEARCH_NO_ANALYTICS:-true}'
        volumes:
            - 'sail-meilisearch:/meili_data'
        networks:
            - sail
        healthcheck:
            test: ['CMD', 'wget', '--no-verbose', '--spider', 'http://127.0.0.1:7700/health']
            interval: 5s
            retries: 10
            timeout: 5s

    mailpit:
        image: 'axllent/mailpit:latest'
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - sail

networks:
    sail:
        driver: bridge

volumes:
    sail-pgsql:
        driver: local
    sail-redis:
        driver: local
    sail-meilisearch:
        driver: local
    sail-node-modules:
        driver: local
