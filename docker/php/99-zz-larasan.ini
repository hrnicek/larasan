; Swoole ships in the Sail image and, with shortnames on, defines a global `defer()` of its own.
; Laravel's `defer()` helper is declared behind `function_exists()`, so it never loads, and every
; call — `RemembersWhatWasOpened` on four screens — reaches Swoole's instead and dies with
; "API must be called in the coroutine". The application does not use Swoole; the aliases go.
swoole.use_shortname = Off
