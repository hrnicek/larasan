<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>No connection</title>
        <link rel="icon" href="/favicon.svg" type="image/svg+xml">
        <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
        <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">

        <!--
            Everything is inline. This document is shown when the network is gone, which is exactly
            when a stylesheet cannot be fetched — a fallback that needs a second request is a
            fallback that shows unstyled text.

            It carries no name, no workspace and no data of any kind. That is what makes it the one
            document the service worker is allowed to hold: it is a constant that ships with the
            repository, not a response the server generated for somebody.
        -->
        <style>
            :root {
                color-scheme: light dark;
                --background: hsl(0 0% 100%);
                --foreground: hsl(0 0% 3.9%);
                --muted-foreground: hsl(0 0% 45.1%);
                --border: hsl(0 0% 92.8%);
                --primary: hsl(0 0% 9%);
                --primary-foreground: hsl(0 0% 98%);
            }

            @media (prefers-color-scheme: dark) {
                :root {
                    --background: hsl(0 0% 3.9%);
                    --foreground: hsl(0 0% 98%);
                    --muted-foreground: hsl(0 0% 63.9%);
                    --border: hsl(0 0% 14.9%);
                    --primary: hsl(0 0% 98%);
                    --primary-foreground: hsl(0 0% 9%);
                }
            }

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 1.5rem;
                background: var(--background);
                color: var(--foreground);
                font-family: 'Instrument Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
                line-height: 1.5;
            }

            main {
                max-width: 26rem;
                text-align: center;
            }

            h1 {
                margin: 0 0 0.5rem;
                font-size: 1.25rem;
                font-weight: 600;
            }

            p {
                margin: 0;
                color: var(--muted-foreground);
                font-size: 0.875rem;
            }

            button {
                margin-top: 1.5rem;
                padding: 0.5rem 1rem;
                border: 1px solid var(--border);
                border-radius: 0.5rem;
                background: var(--primary);
                color: var(--primary-foreground);
                font: inherit;
                font-size: 0.875rem;
                font-weight: 500;
                cursor: pointer;
            }

            button:focus-visible {
                outline: 2px solid var(--foreground);
                outline-offset: 2px;
            }

            svg {
                display: block;
                margin: 0 auto 1rem;
                color: var(--muted-foreground);
            }
        </style>
    </head>
    <body>
        <main>
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
                <path d="M2 2l20 20" />
                <path d="M8.5 16.5a5 5 0 0 1 7 0" />
                <path d="M5 12.9a10 10 0 0 1 5.2-2.7" />
                <path d="M13.8 10.2A10 10 0 0 1 19 12.9" />
                <path d="M2 8.8a15 15 0 0 1 4.8-2.9" />
                <path d="M10.7 5.1A15 15 0 0 1 22 8.8" />
                <path d="M12 20h.01" />
            </svg>

            <h1>No connection</h1>
            <p>
                This page could not be loaded because the device is offline. Nothing has been lost —
                the application will come back as soon as the network does.
            </p>

            <button type="button" onclick="location.reload()">Try again</button>
        </main>

        <script>
            // Coming back recovers without anybody pressing anything. The button above is for the
            // other case: a network that is technically there and still cannot reach the server.
            window.addEventListener('online', () => location.reload());
        </script>
    </body>
</html>
